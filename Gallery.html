<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="Home.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
    <header>
        <h1>K-Playlist</h1>
        <div class="navLinks">
            <a href="Home.html">Home</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="Gallery.html">Gallery</a>
        </div>

        <div class="nav">
            <h2>Created by <a href="https://github.com/Torigami2005" target="_blank"
                    rel="noopener noreferrer">Torigami_2005</a></h2>
            <button id="theme-switch">
                <img src="darkmode.svg" alt="Dark mode">
                <img src="lightmode.svg" alt="Light mode">
            </button>
        </div>
    </header>

    <main class="gallery-container">
        <h2>Image Gallery</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="image.png" alt="Gallery Image 1">
            </div>
            <div class="gallery-item">
                <img src="image2.png" alt="Gallery Image 2">
            </div>
            <div class="gallery-item">
                <img src="image3.png" alt="Gallery Image 3">
            </div>
            <div class="gallery-item">
                <img src="image4.png" alt="Gallery Image 4">
            </div>
            <div class="gallery-item">
                <img src="image5.png" alt="Gallery Image 5">
            </div>
            <div class="gallery-item">
                <img src="image6.png" alt="Gallery Image 6">
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 K-Playlist. All rights reserved.</p>
    </footer>
</body>
<script src="gallery.js"></script>

</html>
